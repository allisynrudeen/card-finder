name: Daily Card Scan

on:
  workflow_dispatch:   # lets you click "Run workflow" manually to test it
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = ~7:00 AM Central (shifts an hour with daylight saving)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily card scan
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python3 run_live.py

      - name: Configure git
        run: git config user.name "Card Finder Bot" && git config user.email "actions@github.com"

      - name: Stage updated files
        run: git add daily_report.html dashboard.html deals_data.json

      - name: Commit if anything changed
        run: git diff --staged --quiet || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"

      - name: Push
        run: git push
